[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops-intelligence"
version = "0.1.0"
description = "Reproducible analytics for US airline operations data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
flightops-ingest = "flightops.ingestion.cli:main"

[project.optional-dependencies]
dev = [
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.11,<1.12",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.setuptools.packages.find]
where = ["src"]

