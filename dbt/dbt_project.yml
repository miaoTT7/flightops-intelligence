name: flightops_intelligence
version: 1.0.0
config-version: 2

profile: flightops_intelligence

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: target
clean-targets:
  - target
  - dbt_packages
  - logs

require-dbt-version: [">=1.11.0", "<1.12.0"]

vars:
  # Deliberately invalid defaults: callers must provide an explicit single month.
  phase3a_batch_start_date: ""
  phase3a_batch_end_date: ""

models:
  flightops_intelligence:
    marts:
      +materialized: table
      +schema: marts

